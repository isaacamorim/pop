<!--frontend/pop_front/pop-view.html-->

<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ver POP</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <div class="container">
        <div class="pop-header topbar">
            <div>
                <h1 id="title">POP</h1>
                <div class="sub" id="subtitle"></div>
            </div>
            <div class="top-actions">
                <button id="btnBack" class="btn">← Voltar</button>
            </div>
        </div>

        <div class="card">
            <div id="status" class="muted">Carregando...</div>
            <div class="badge">Versão: v3</div>
            <div class="badge">Criado em: 12/01/2026</div>
            <div class="badge">Status: PUBLISHED</div>
            <pre id="debug" style="display:none;"></pre>
        </div>

        <div class="card">
            <h3>Vínculo</h3>
            <div id="link"></div>
        </div>

        <div class="card">
            <h3 class="section-title">Passos</h3>
            <div id="steps"></div>
        </div>
        
        <div class="footer-bar">
            <button id="btnBackFooter" class="btn">← Voltar</button>
        
            <button id="btnNewVersion" class="btn primary">
                ✏️ Criar nova versão
            </button>
        </div>
    </div>

    <script type="module" src="./js/pop-view.js"></script>
</body>

</html>
