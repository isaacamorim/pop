<!-- frontend/pop_front/pop-create.html -->
<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cadastrar POP</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <div class="container">
        <div class="topbar">
            <div>
                <h1>Cadastrar POP</h1>
                <div class="sub">Assistente rápido (rascunho salva automático) → Publicar no final.</div>
            </div>
            <div style="display:flex; gap:10px;">
                <a class="btn" href="./pop-list.html">Voltar</a>
            </div>
        </div>

        <div class="card" id="wizard">

            <!-- STEP 1 -->
            <section class="wstep" data-step="1">
                <h2>1) Onde esse POP vai aparecer?</h2>

                <label>Vínculo</label>
                <select id="LINK_TYPE">
                    <option value="">Selecione...</option>
                    <option value="MAQUINA">Máquina</option>
                    <option value="TAREFA">Operação/Tarefa</option>
                    <option value="NP">NP</option>
                    <option value="PECA">Peça</option>
                    <option value="PECA_OP">Peça + Operação</option>
                    <option value="SERVICO">Serviço</option>
                </select>

                <small id="hintLink" class="muted" style="display:block; margin-top:8px;"></small>
            </section>

            <!-- STEP 2 -->
            <section class="wstep" data-step="2" style="display:none">
                <h2>2) Detalhe do vínculo</h2>

                <div id="blkMachine" style="display:none; margin-top:10px;">
                    <label>Máquina</label>
                    <select id="COD_MAQUINA">
                        <option value="">Selecione...</option>
                    </select>
                    <div class="muted" style="font-size:12px; margin-top:6px;">Puxado de J_MAQUINA</div>
                </div>

                <div id="blkTask" style="display:none; margin-top:10px;">
                    <label>Tarefa</label>
                    <select id="COD_TAREFA">
                        <option value="">Selecione...</option>
                    </select>
                    <div class="muted" style="font-size:12px; margin-top:6px;">Puxado de J_TAREFAS</div>
                </div>

                <div id="blkNp" style="display:none; margin-top:10px;">
                    <label>NP (em produção)</label>
                    <select id="NP_CODIGO">
                        <option value="">Selecione...</option>
                    </select>
                
                    <div class="muted" style="font-size:12px; margin-top:6px;">
                        Mostra: NP + Produto + Descrição
                    </div>
                
                    <label style="margin-top:8px;">Sequência (opcional)</label>
                    <input id="SEQ_COD" placeholder="Ex: 0010" />
                </div>

                <div id="blkProduct" style="display:none; margin-top:10px;">
                    <label>Produto</label>
                
                    <input id="PRODUCT_Q" placeholder="Buscar produto (código ou descrição)..." />
                    <div id="productResults" class="card" style="display:none; margin-top:8px; padding:0;"></div>
                
                    <label style="margin-top:8px;">Código selecionado</label>
                    <input id="PRODUCT_CODE" placeholder="Ex: P000123" />
                </div>
            </section>

            <!-- STEP 3 -->
            <section class="wstep" data-step="3" style="display:none">
                <h2>3) Conteúdo</h2>

                <label>Título</label>
                <input id="TITLE" placeholder="Ex: Ligar máquina / Setup / Limpeza..." />

                <label style="margin-top:10px;">Descrição</label>
                <textarea id="DESCRIPTION" placeholder="Resumo do POP"></textarea>

                <h3 style="margin-top:14px;">Passos</h3>
                <div id="stepsList"></div>

                <button id="btnAddStep" class="btn" type="button" style="margin-top:10px;">
                    + Adicionar passo
                </button>
            </section>

            <!-- STEP 4 -->
            <section class="wstep" data-step="4" style="display:none">
                <h2>4) Revisão</h2>
                <pre id="review" style="white-space:pre-wrap;"></pre>

                <button id="btnPublish" class="btn primary" type="button">
                    Publicar
                </button>
            </section>

            <hr class="sep" />

            <div style="margin-top:16px; display:flex; gap:8px; align-items:center;">
                <button id="btnBack" class="btn" type="button">Voltar</button>
                <button id="btnNext" class="btn primary" type="button">Avançar</button>
                <span id="statusMsg" class="muted" style="margin-left:8px;"></span>
            </div>

        </div>
    </div>

    <script type="module" src="./js/pop-create.js"></script>
</body>

</html>
